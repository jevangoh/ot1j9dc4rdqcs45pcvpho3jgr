[project]
site_name = "ot1j9dc4rdqcs45pcvpho3jgr"
site_url = "https://ot1j9dc4rdqcs45pcvpho3jgr.readthedocs.io/en/latest/"
site_description = ""
site_author = "Jevan Goh"
language = "en"

docs_dir = "documentation"

repo_url = "https://github.com/jevangoh/ot1j9dc4rdqcs45pcvpho3jgr"
edit_uri = "tree/main/ot1j9dc4rdqcs45pcvpho3jgr/"

# --- Theme ---
[project.theme]
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "content.action.view"
]

[project.theme.icon]
repo = "fontawesome/brands/git-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "light blue"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

# --- Navigation Tree ---
[[nav]]
Home = "index.md"

[[nav]]
Labels = "labels.md"